version: '3.8'

services:
  # Database services configuration
  db:
    image: postgres:15-alpine
    container_name: ame_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ame
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ame"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API Server gateways
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ame_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ame
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@db:5432/ame

  # Next.js client visual dashboard hub
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ame_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1

volumes:
  postgres_data:
